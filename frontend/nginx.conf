server {
    listen 80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React application
    location / {
        try_files $uri $uri/ /index.html;
    }

    # FastAPI backend, for docker-compose only: on AWS the ALB sends /api/* to
    # the backend directly, so this block is never reached there. Proxying via
    # a variable defers the DNS lookup to request time; a literal hostname is
    # resolved at startup and nginx exits wherever "backend" doesn't exist.
    location /api/ {
        resolver 127.0.0.11 valid=10s;  # Docker's embedded DNS
        set $backend http://backend:8000;
        proxy_pass $backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}